services:
  backend1:
    image: traefik/whoami
    command: ["--port", "8080"]
  backend2:
    image: traefik/whoami
    command: ["--port", "8080"]
  backend3:
    image: traefik/whoami
    command: ["--port", "8080"]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    ports:
      - "8080:80"