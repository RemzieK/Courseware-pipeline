spring.application.name=unicloud
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:unicloud}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

# Storage and multipart upload configuration (UC-13, UC-29)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
spring.servlet.multipart.enabled=true
storage.local.root-dir=${STORAGE_ROOT_DIR:/var/unicloud/storage}

# ==============================================================================
# UC-32 – OpenAPI / Swagger UI configuration
# ==============================================================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
# Group the full API so SE 2 can link directly to it
springdoc.group-configs[0].group=public-api
springdoc.group-configs[0].display-name=UniCloud REST API v1
springdoc.group-configs[0].paths-to-match=/api/v1/**
spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE