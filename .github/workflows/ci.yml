name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build placeholder image
        run: docker build deploy-demo

      # These steps run only once the real code exists
      - uses: actions/setup-java@v4
        if: hashFiles('backend/unicloud/pom.xml') != ''
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Backend build and tests
        if: hashFiles('backend/unicloud/pom.xml') != ''
        run: mvn -B verify
        working-directory: backend/unicloud

      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: 20
      - name: Frontend build and tests
        if: hashFiles('frontend/package.json') != ''
        run: |
          npm ci
          npm test --if-present
          npm run build
        working-directory: frontend