name: Security CI Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-scan:
    name: Trivy Vulnerability Scan (FS & Configs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK & cache Maven
        if: hashFiles('backend/unicloud/pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Pre-populate Maven local cache
        if: hashFiles('backend/unicloud/pom.xml') != ''
        run: mvn -B -f backend/unicloud/pom.xml dependency:resolve  
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check if backend pom.xml or build.gradle exists
        id: check_backend
        run: |
          if [ -f "backend/unicloud/pom.xml" ] || [ -f "backend/unicloud/build.gradle" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Run OWASP Dependency-Check
        if: steps.check_backend.outputs.exists == 'true'
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'UniCloud'
          path: 'backend/unicloud'
          format: 'HTML'
          args: >
            --failOnCVSS 9
